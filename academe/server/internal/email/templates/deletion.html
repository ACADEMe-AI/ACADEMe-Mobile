{{define "content"}}{{template "heading" .Heading}}
{{template "text" .Lead}}
<p class="ink" style="margin:24px 0 8px;font-family:'Archivo','Noto Sans',Arial,Helvetica,sans-serif;font-size:17px;line-height:24px;font-weight:700;color:#12141A;">{{.OpenTitle}}</p>
<p class="muted" style="margin:0 0 16px;font-size:16px;line-height:24px;color:#5C6578;">{{.Before}}<strong class="ink" style="color:#12141A;">{{.Emphasis}}</strong>{{.After}}</p>
<p class="ink" style="margin:24px 0 8px;font-family:'Archivo','Noto Sans',Arial,Helvetica,sans-serif;font-size:17px;line-height:24px;font-weight:700;color:#12141A;">{{.CantTitle}}</p>
<p class="muted" style="margin:0 0 24px;font-size:16px;line-height:24px;color:#5C6578;">{{.CantBody}}</p>
{{template "button" .Button}}
<p class="muted" style="margin:32px 0 0;font-size:14px;line-height:22px;color:#5C6578;">{{.Ignore}}</p>
{{end}}
