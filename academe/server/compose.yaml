services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: academe
      POSTGRES_PASSWORD: academe
      POSTGRES_DB: academe
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "academe"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
